name: base-analytics

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.1.3
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8082:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      RAW_BLOCK_TOPIC: ${REDPANDA_RAW_BLOCK_TOPIC:-base.block.raw.v1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic describe "$${RAW_BLOCK_TOPIC}" --brokers redpanda:9092 >/dev/null 2>&1 ||
          rpk topic create "$${RAW_BLOCK_TOPIC}" --brokers redpanda:9092 --partitions 3 --replicas 1
        rpk topic alter-config "$${RAW_BLOCK_TOPIC}" --brokers redpanda:9092 \
          --set max.message.bytes=16777216 --no-confirm

  clickhouse:
    image: clickhouse/clickhouse-server:25.6
    environment:
      CLICKHOUSE_DB: base
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--database", "base", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: base
      POSTGRES_USER: base
      POSTGRES_PASSWORD: base
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U base -d base"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: base
      MINIO_ROOT_PASSWORD: base-local-secret
    ports:
      - "9001:9001"
      - "9002:9000"
    volumes:
      - minio-data:/data

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for file in /migrations/postgres/*.sql; do
          PGPASSWORD=base psql -h postgres -U base -d base -v ON_ERROR_STOP=1 -f "$$file"
        done
        for file in /migrations/clickhouse/*.sql; do
          wget -O- --post-data="$$(cat "$$file")" "http://clickhouse:8123/?database=base"
        done

  block-ingestor:
    build:
      context: .
      target: block-ingestor
    env_file:
      - path: .env
        required: false
    environment:
      REDPANDA_BROKERS: redpanda:9092
      POSTGRES_DSN: postgres://base:base@postgres:5432/base?sslmode=disable
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  block-writer:
    build:
      context: .
      target: block-writer
    env_file:
      - path: .env
        required: false
    environment:
      REDPANDA_BROKERS: redpanda:9092
      CLICKHOUSE_ADDR: clickhouse:9000
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  event-parser:
    build:
      context: .
      target: event-parser
    env_file:
      - path: .env
        required: false
    environment:
      REDPANDA_BROKERS: redpanda:9092
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_DSN: postgres://base:base@postgres:5432/base?sslmode=disable
      REGISTRY_ENRICHMENT_TIMEOUT: ${REGISTRY_ENRICHMENT_TIMEOUT:-100ms}
      REDPANDA_EVENT_PARSER_CONSUMER_GROUP: ${REDPANDA_EVENT_PARSER_CONSUMER_GROUP:-base-event-parser-v4}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  registry-backfill:
    build:
      context: .
      target: registry-backfill
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_DSN: postgres://base:base@postgres:5432/base?sslmode=disable
      REGISTRY_BACKFILL_BATCH_SIZE: ${REGISTRY_BACKFILL_BATCH_SIZE:-100}
      REGISTRY_BACKFILL_BATCH_TIMEOUT: ${REGISTRY_BACKFILL_BATCH_TIMEOUT:-2m}
      REGISTRY_BACKFILL_SCAN_INTERVAL: ${REGISTRY_BACKFILL_SCAN_INTERVAL:-30s}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  market-sync:
    build:
      context: .
      target: market-sync
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_DSN: postgres://base:base@postgres:5432/base?sslmode=disable
      AVE_BASE_URL: ${AVE_BASE_URL:-https://prod.ave-api.com}
      MARKET_SYNC_BATCH_SIZE: ${MARKET_SYNC_BATCH_SIZE:-200}
      MARKET_RISK_BATCH_SIZE: ${MARKET_RISK_BATCH_SIZE:-10}
      MARKET_SYNC_INTERVAL: ${MARKET_SYNC_INTERVAL:-5m}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  valuation-worker:
    build:
      context: .
      target: valuation-worker
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      VALUATION_BATCH_SIZE: ${VALUATION_BATCH_SIZE:-500}
      VALUATION_LOOKBACK: ${VALUATION_LOOKBACK:-1h}
      VALUATION_MAX_PRICE_AGE: ${VALUATION_MAX_PRICE_AGE:-10m}
      VALUATION_POLL_INTERVAL: ${VALUATION_POLL_INTERVAL:-2s}
      LARGE_TRADE_USD: ${LARGE_TRADE_USD:-10000}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  alert-worker:
    build:
      context: .
      target: alert-worker
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_DSN: postgres://base:base@postgres:5432/base?sslmode=disable
      ALERT_BATCH_SIZE: ${ALERT_BATCH_SIZE:-500}
      ALERT_LOOKBACK: ${ALERT_LOOKBACK:-1h}
      ALERT_POLL_INTERVAL: ${ALERT_POLL_INTERVAL:-5s}
      ALERT_CRITICAL_USD: ${ALERT_CRITICAL_USD:-50000}
      ALERT_QUOTE_SYMBOLS: ${ALERT_QUOTE_SYMBOLS:-WETH,USDC,USDbC,USDT,DAI,EURC,cbBTC}
      ALERT_SMART_SCORE_VERSION: ${ALERT_SMART_SCORE_VERSION:-smart-v1}
      ALERT_SMART_SCORE_MIN: ${ALERT_SMART_SCORE_MIN:-65}
      ALERT_SMART_CONFIDENCE_MIN: ${ALERT_SMART_CONFIDENCE_MIN:-0.6}
      ALERT_SMART_TRADE_MIN_USD: ${ALERT_SMART_TRADE_MIN_USD:-1000}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  alert-dispatcher:
    build:
      context: .
      target: alert-dispatcher
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DSN: postgres://base:base@postgres:5432/base?sslmode=disable
      ALERT_DELIVERY_BATCH_SIZE: ${ALERT_DELIVERY_BATCH_SIZE:-20}
      ALERT_DELIVERY_LEASE: ${ALERT_DELIVERY_LEASE:-30s}
      ALERT_DELIVERY_POLL_INTERVAL: ${ALERT_DELIVERY_POLL_INTERVAL:-2s}
      ALERT_DELIVERY_TIMEOUT: ${ALERT_DELIVERY_TIMEOUT:-10s}
      ALERT_DELIVERY_MAX_ATTEMPTS: ${ALERT_DELIVERY_MAX_ATTEMPTS:-8}
      ALERT_DELIVERY_RETRY_BASE: ${ALERT_DELIVERY_RETRY_BASE:-5s}
      ALERT_DELIVERY_RETRY_MAX: ${ALERT_DELIVERY_RETRY_MAX:-15m}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  query-api:
    build:
      context: .
      target: query-api
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DSN: postgres://base:base@postgres:5432/base?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      API_LISTEN_ADDRESS: ${API_LISTEN_ADDRESS:-:8080}
      API_ALERT_POLL_INTERVAL: ${API_ALERT_POLL_INTERVAL:-1s}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  wallet-profile-worker:
    build:
      context: .
      target: wallet-profile-worker
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      WALLET_PROFILE_BATCH_SIZE: ${WALLET_PROFILE_BATCH_SIZE:-1000}
      WALLET_PROFILE_POLL_INTERVAL: ${WALLET_PROFILE_POLL_INTERVAL:-2s}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  gmgn-wallet-sync:
    build:
      context: .
      target: gmgn-wallet-sync
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      GMGN_BASE_URL: ${GMGN_BASE_URL:-https://openapi.gmgn.ai}
      GMGN_REQUEST_TIMEOUT: ${GMGN_REQUEST_TIMEOUT:-15s}
      GMGN_MIN_REQUEST_INTERVAL: ${GMGN_MIN_REQUEST_INTERVAL:-5s}
      GMGN_WALLET_PERIODS: ${GMGN_WALLET_PERIODS:-7d,30d}
      GMGN_WALLET_SYNC_BATCH_SIZE: ${GMGN_WALLET_SYNC_BATCH_SIZE:-5}
      GMGN_WALLET_FRESHNESS: ${GMGN_WALLET_FRESHNESS:-1h}
      GMGN_WALLET_ACTIVE_LOOKBACK: ${GMGN_WALLET_ACTIVE_LOOKBACK:-24h}
      GMGN_WALLET_SYNC_INTERVAL: ${GMGN_WALLET_SYNC_INTERVAL:-5s}
      GMGN_WALLET_RETRY_BASE: ${GMGN_WALLET_RETRY_BASE:-5m}
    depends_on:
      clickhouse:
        condition: service_healthy
      wallet-profile-worker:
        condition: service_started
    restart: unless-stopped

  wallet-analytics-worker:
    build:
      context: .
      target: wallet-analytics-worker
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      WALLET_ANALYTICS_BATCH_SIZE: ${WALLET_ANALYTICS_BATCH_SIZE:-20}
      WALLET_ANALYTICS_POLL_INTERVAL: ${WALLET_ANALYTICS_POLL_INTERVAL:-5s}
      WALLET_ANALYTICS_MAX_PRICE_AGE: ${WALLET_ANALYTICS_MAX_PRICE_AGE:-2h}
      ALERT_QUOTE_SYMBOLS: ${ALERT_QUOTE_SYMBOLS:-WETH,USDC,USDbC,USDT,DAI,EURC,cbBTC}
    depends_on:
      clickhouse:
        condition: service_healthy
      wallet-profile-worker:
        condition: service_started
    restart: unless-stopped

  flashblocks-worker:
    build:
      context: .
      target: flashblocks-worker
    env_file:
      - path: .env
        required: false
    environment:
      BASE_HTTP_URL: ${BASE_HTTP_URL:-https://mainnet.base.org}
      FLASHBLOCKS_HTTP_URL: ${FLASHBLOCKS_HTTP_URL:-https://mainnet-preconf.base.org}
      FLASHBLOCKS_WSS_URL: ${FLASHBLOCKS_WSS_URL:-wss://mainnet-preconf.base.org}
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_DSN: postgres://base:base@postgres:5432/base?sslmode=disable
      FLASHBLOCKS_RECONCILIATION_TTL: ${FLASHBLOCKS_RECONCILIATION_TTL:-30s}
      FLASHBLOCKS_RECONCILE_BATCH: ${FLASHBLOCKS_RECONCILE_BATCH:-100}
      FLASHBLOCKS_RECONCILE_INTERVAL: ${FLASHBLOCKS_RECONCILE_INTERVAL:-1s}
      FLASHBLOCKS_RECONNECT_DELAY: ${FLASHBLOCKS_RECONNECT_DELAY:-30s}
      FLASHBLOCKS_REQUEST_TIMEOUT: ${FLASHBLOCKS_REQUEST_TIMEOUT:-2s}
      FLASHBLOCKS_FALLBACK_POLL_INTERVAL: ${FLASHBLOCKS_FALLBACK_POLL_INTERVAL:-2s}
      ALERT_CRITICAL_USD: ${ALERT_CRITICAL_USD:-50000}
      ALERT_QUOTE_SYMBOLS: ${ALERT_QUOTE_SYMBOLS:-WETH,USDC,USDbC,USDT,DAI,EURC,cbBTC}
      ALERT_SMART_SCORE_VERSION: ${ALERT_SMART_SCORE_VERSION:-smart-v1}
      ALERT_SMART_SCORE_MIN: ${ALERT_SMART_SCORE_MIN:-65}
      ALERT_SMART_CONFIDENCE_MIN: ${ALERT_SMART_CONFIDENCE_MIN:-0.6}
      ALERT_SMART_TRADE_MIN_USD: ${ALERT_SMART_TRADE_MIN_USD:-1000}
      VALUATION_MAX_PRICE_AGE: ${VALUATION_MAX_PRICE_AGE:-10m}
      LARGE_TRADE_USD: ${LARGE_TRADE_USD:-10000}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  trace-worker:
    profiles:
      - archive
    build:
      context: .
      target: trace-worker
    env_file:
      - path: .env
        required: false
    environment:
      ARCHIVE_RPC_URL: ${ARCHIVE_RPC_URL:-https://mainnet.base.org}
      BASE_CHAIN_ID: ${BASE_CHAIN_ID:-8453}
      CLICKHOUSE_ADDR: clickhouse:9000
      TRACE_START_BLOCK: ${TRACE_START_BLOCK:-0}
      TRACE_BATCH_SIZE: ${TRACE_BATCH_SIZE:-5}
      TRACE_POLL_INTERVAL: ${TRACE_POLL_INTERVAL:-10s}
      TRACE_REQUEST_TIMEOUT: ${TRACE_REQUEST_TIMEOUT:-30s}
      TRACE_TRACER_TIMEOUT: ${TRACE_TRACER_TIMEOUT:-20s}
      TRACE_MIN_REQUEST_INTERVAL: ${TRACE_MIN_REQUEST_INTERVAL:-1s}
      TRACE_MAX_ATTEMPTS: ${TRACE_MAX_ATTEMPTS:-5}
      TRACE_RETRY_BASE: ${TRACE_RETRY_BASE:-30s}
      TRACE_RETRY_MAX: ${TRACE_RETRY_MAX:-30m}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redpanda-data:
  clickhouse-data:
  postgres-data:
  redis-data:
  minio-data:
